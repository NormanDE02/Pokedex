<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="./css/header.css">
    <link rel="stylesheet" type="text/css" href="./css/card.css">
    <link rel="stylesheet" type="text/css" href="./css/type.css">
    <link rel="stylesheet" type="text/css" href="./css/dialog.css">
    <link rel="stylesheet" type="text/css" href="./css/overlay.css">
    <link rel="stylesheet" type="text/css" href="./style.css">

    <script src="./js/template.js" defer></script>
    <script src="script.js" defer></script>

    <link rel="icon" type="image/x-icon" href="./assets/img/icon/favicon.jpg">
    <title>Pokedex</title>
</head>

<body onload="initPokeCard()">
    <header class="header__container">
        <div class="header__inner">
            <h1 class="header__headline">P<span class="header__span">o</span>k<span class="header__span">e</span>d<span
                    class="header__span">e</span>x</h1>
            <div class="search__container">
                <div class="header__flexbox" role="search">
                    <label class="visually-hidden" for="pokemon-search">
                        Search for a Pokémon
                    </label>
                    <input data-id="search-input" type="search" placeholder="Need three letters" class="header__input" autocomplete="off">
                    <button data-id=”search-button” type="button" class="header__button" aria-label="Search for Pokémon" onclick="initSearch()">
                        <img class="header__img" src=".//assets/img/icon/search-icon.svg" alt="" aria-hidden="true">
                    </button>
                </div>
            </div>
        </div>
    </header>
    <main data-id="content">
        <section class="section__inner" aria-label="Pokémon list">
            <ul class="section__list" id="card-list" aria-live="polite" aria-busy="false">

            </ul>
            <nav class="section__flexbox" aria-label="Pokémon pagination">
                <button class="section__button"  type="button" onclick="togglePokemon(false)"> <span aria-hidden="true">←</span> Back </button>
                <Button data-id="load-more-button" class="section__button" type="button" onclick="togglePokemon(true)"> Next <span aria-hidden="true">→</span> </Button>
            </nav>
        </section>

        <dialog data-id="dialog" class="dialog__container" id="show-dialog" aria-label="Pokémon details" onclick="closeDialogOutside(event)">

        </dialog>
    </main>
    <div class="overlay__container" id="load-overlay" role="status" aria-live="polite" aria-label="Loading Pokémon">
        <div class="overlay__inner">
            <img class="overlay__img" src="./assets/img/Pokeball.png" alt="Pokeball" aria-hidden="true">
            <span class="overlay__text">Loading-Pokedex</span>
        </div>
    </div>
</body>

</html>
