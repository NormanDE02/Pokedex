<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="./css/header.css">
    <link rel="stylesheet" type="text/css" href="./css/card.css">
    <link rel="stylesheet" type="text/css" href="./css/type.css">
    <link rel="stylesheet" type="text/css" href="./css/dialog.css">
    <link rel="stylesheet" type="text/css" href="./style.css">

    <script src="./js/template.js" defer></script>
    <script src="script.js" defer></script>

    <link rel="icon" type="image/x-icon" href="./assets/img/icon/favicon.jpg">
    <title>Pokedex</title>
</head>
<body onload="initPokeCard()">
    <h1 class="header__headline">P<span class="header__span">o</span>k<span class="header__span">e</span>d<span class="header__span">e</span>x</h1>
    <main>
        <section>
            <ul class="section__list" id="card-list">
                
            </ul>
            <div class="section__flexbox">
                <button class="section__button" onclick="loadBackPokemon()"> ← Back </button>
                <Button class="section__button" onclick="loadNextPokemon()"> Next → </Button>
            </div>    
        </section>
        <dialog class="dialog__container" id="dialog-pokemon">
            <header class="dialog__header">
                <div class="dialog__flex">
                    <h2 class="dialog__headline">Bulbasaaur</h2>
                    <span class="dialog__span">#1</span>
                </div>
                <div class="dialog__flex">
                    <div>
                        <span class="dialog__span">Type1</span>
                        <span class="dialog__span">Type2</span>
                    </div>
                    <img src="#" alt="">
                </div>
            </header>
            <hr>
        </dialog>
    </main>
</body>
</html>
