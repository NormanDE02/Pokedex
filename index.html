<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="./css/header.css">
    <link rel="stylesheet" type="text/css" href="./css/card.css">
    <link rel="stylesheet" type="text/css" href="./css/type.css">
    <link rel="stylesheet" type="text/css" href="./css/dialog.css">
    <link rel="stylesheet" type="text/css" href="./css/overlay.css">
    <link rel="stylesheet" type="text/css" href="./style.css">

    <script src="./js/template.js" defer></script>
    <script src="script.js" defer></script>

    <link rel="icon" type="image/x-icon" href="./assets/img/icon/favicon.jpg">
    <title>Pokedex</title>
</head>

<body onload="initPokeCard()">
    <header class="header__container">
        <div class="header__inner">
            <h1 class="header__headline">P<span class="header__span">o</span>k<span class="header__span">e</span>d<span
            class="header__span">e</span>x</h1>
            <div class="header__flexbox">
                <input data-id="search-input" type="search" class="header__input">
                <button data-id=”search-button” type="button" class="header__button">
                    <img class="header__img" src=".//assets/img/icon/search-icon.svg" alt="">
                </button>
            </div>
        </div>
    </header>
    <main data-id="content">
        <section>
            <ul class="section__list" id="card-list">

            </ul>
            <div class="section__flexbox">
                <button class="section__button" onclick="loadBackPokemon()"> ← Back </button>
                <Button data-id="load-more-button" class="section__button" onclick="loadNextPokemon()"> Next → </Button>
            </div>
        </section>

        <dialog data-id="dialog" class="dialog__container" id="show-dialog" onclick="closeDialogOutside(event)">

        </dialog>
    </main>
    <div class="overlay__container" id="load-overlay">
        <div class="overlay__inner">
            <img class="overlay__img" src="./assets/img/Pokeball.png" alt="Pokeball">
            <span class="overlay__text">Loading-Pokedex</span>
        </div>
    </div>
</body>

</html>
